name: SiftAlpha Cloud Manager Android Keystore

on:
  push:
    branches:
      - codex/cloud-manager-m2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftalpha-cloud-keystore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-keystore:
    name: Android Keystore instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check whether the M2.1 instrumentation test exists
        id: test-presence
        shell: bash
        run: |
          set -euo pipefail
          test_path="app/src/androidTest/java/com/siftalpha/studio/cloud/AndroidCloudCredentialStoreTest.kt"
          if [[ -f "$test_path" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "ANDROID_KEYSTORE_TEST=NOT_YET_IMPLEMENTED"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.test-presence.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.test-presence.outputs.present == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform, build tools, NDK, CMake, and emulator
        if: steps.test-presence.outputs.present == 'true'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.3.13750724" "cmake;3.22.1" \
            "emulator" "system-images;android-35;google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 9.3.1
        if: steps.test-presence.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare Android runtime assets
        if: steps.test-presence.outputs.present == 'true'
        run: |
          set -euo pipefail
          tools/prepare_embedded_cpython_android.sh app/build/generated/cpython/arm64-v8a
          tools/prepare_internal_alpine_android.sh app/build/generated/internal-alpine

      - name: Run Android Keystore instrumentation on emulator
        if: steps.test-presence.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon --stacktrace --console=plain :app:connectedDebugAndroidTest \
              -PsiftalphaCloudKeystoreTest=true \
              -Pandroid.testInstrumentationRunnerArguments.class=com.siftalpha.studio.cloud.AndroidCloudCredentialStoreTest
            echo "ANDROID_KEYSTORE_TEST=PASS"
