# W2: publish configuration semantics alpha15 test APK
# W2: verify encrypted certificate restore
# W2: verify repository signing secret
# W2: publish device acceptance APK
# W2: configuration candidates remain optional until runtime evidence
name: SiftAlpha W0 Cloud Build

on:
  push:
    branches:
      - main
      - codex/siftalpha-x-embedded-cpython-spike
      - codex/siftalpha-no-worker-alpha43
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siftalpha-w0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Prepare official CPython Android component
        run: |
          set -euo pipefail
          tools/prepare_embedded_cpython_android.sh app/build/generated/cpython/arm64-v8a
          mkdir -p w0-evidence
          cp app/build/generated/cpython/arm64-v8a/prepare-status.txt \
            w0-evidence/cpython-prepare-status.txt
          cp app/build/generated/cpython/arm64-v8a/assets/siftalphax/cpython/PROVENANCE.md \
            w0-evidence/cpython-provenance.md

      - name: Prepare Internal Alpine Android runtime
        run: |
          set -euo pipefail
          tools/prepare_internal_alpine_android.sh app/build/generated/internal-alpine
          mkdir -p w0-evidence
          cp app/build/generated/internal-alpine/prepare-status.txt             w0-evidence/internal-alpine-prepare-status.txt
          cp app/build/generated/internal-alpine/assets/siftalphax/alpine/PROVENANCE.txt             w0-evidence/internal-alpine-provenance.txt
          cp app/build/generated/internal-alpine/artifact-sha256.txt             w0-evidence/internal-alpine-artifact-sha256.txt

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare stable test signing
        env:
          SIFTALPHA_SIGNING_PASSPHRASE: ${{ secrets.SIFTALPHA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p w0-evidence
          encrypted_file="signing/siftalpha-test.keystore.enc.b64"
          signing_file="$RUNNER_TEMP/siftalpha-test.keystore.jks"
          signing_alias="siftalpha-test"
          if [[ -z "${SIFTALPHA_SIGNING_PASSPHRASE:-}" ]]; then
            echo "stable signing: not configured" | tee w0-evidence/signing-setup.txt
            exit 0
          fi

          signing_password="$(printf '%s' "$SIFTALPHA_SIGNING_PASSPHRASE" | sha256sum | cut -c1-32)"
          echo "::add-mask::$signing_password"
          if [[ -f "$encrypted_file" ]]; then
            base64 --decode "$encrypted_file" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:SIFTALPHA_SIGNING_PASSPHRASE -out "$signing_file"
            echo "stable signing: restored encrypted certificate" | tee w0-evidence/signing-setup.txt
          else
            keytool -genkeypair -noprompt \
              -keystore "$signing_file" \
              -storepass "$signing_password" \
              -alias "$signing_alias" \
              -keypass "$signing_password" \
              -dname "CN=SiftAlpha Studio Test, OU=Mobile, O=SiftAlpha, C=MY" \
              -keyalg RSA -keysize 3072 -validity 3650
            mkdir -p signing
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass env:SIFTALPHA_SIGNING_PASSPHRASE -in "$signing_file" | base64 -w0 > "$encrypted_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$encrypted_file"
            git commit -m "Initialize encrypted test signing certificate"
            git push
            echo "stable signing: generated encrypted certificate" | tee w0-evidence/signing-setup.txt
          fi

          keytool -list -keystore "$signing_file" -storepass "$signing_password" \
            -alias "$signing_alias" >/dev/null
          {
            echo "SIFTALPHA_DEBUG_KEYSTORE_FILE=$signing_file"
            echo "SIFTALPHA_DEBUG_STORE_PASSWORD=$signing_password"
            echo "SIFTALPHA_DEBUG_KEY_ALIAS=$signing_alias"
            echo "SIFTALPHA_DEBUG_KEY_PASSWORD=$signing_password"
          } >> "$GITHUB_ENV"

      - name: Record W0 source and toolchain
        run: |
          mkdir -p w0-evidence
          git rev-parse HEAD > w0-evidence/source-commit.txt
          git status --short > w0-evidence/source-status.txt
          gradle --version > w0-evidence/gradle-version.txt
          java -version > w0-evidence/java-version.txt 2>&1
          sdkmanager --list_installed > w0-evidence/android-sdk-packages.txt

      - name: Run repository validators
        run: |
          set -o pipefail
          python3 tools/validate_launcher_icon.py | tee w0-evidence/validate-launcher.txt
          python3 tools/validate_localization_resources.py | tee w0-evidence/validate-localization.txt
          python3 tools/validate_localized_ui_sources.py | tee w0-evidence/validate-localized-ui.txt

      - name: Run unit tests and assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug | tee w0-evidence/gradle-build.txt

      - name: Collect APK evidence
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$sdk_root/build-tools/36.0.0"
          cp "$apk" w0-evidence/siftalpha-studio-debug.apk
          unzip -l "$apk" | tee w0-evidence/apk-contents.txt
          grep -q 'lib/arm64-v8a/libproot.so' w0-evidence/apk-contents.txt
          grep -q 'lib/arm64-v8a/libproot-loader.so' w0-evidence/apk-contents.txt
          grep -q 'assets/siftalphax/alpine/alpine-minirootfs.tgzblob' w0-evidence/apk-contents.txt
          sha256sum "$apk" | tee w0-evidence/apk-sha256.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee w0-evidence/apk-certificates.txt
          "$build_tools/aapt2" dump badging "$apk" | tee w0-evidence/apk-badging.txt

      - name: Publish W2 test APK
        if: ${{ github.event.head_commit.message == 'Publish W2 test APK' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "w2-test-${GITHUB_SHA::7}" \
            "app/build/outputs/apk/debug/app-debug.apk#SiftAlpha-Studio-W2-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "SiftAlpha Studio W2 test" \
            --notes "Debug APK for W2 device acceptance. Commit: $GITHUB_SHA" \
            --prerelease

      - name: Upload APK and W0 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: siftalpha-w0-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            w0-evidence
          if-no-files-found: warn
          retention-days: 14
