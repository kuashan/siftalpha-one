name: SiftAlpha Android Wheelhouse

on:
  push:
    branches:
      - codex/siftalpha-no-worker-alpha43
    paths:
      - .github/workflows/android-wheelhouse.yml
      - tools/build_android_wheelhouse_package.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build ${{ matrix.package }} Android wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: crc32c
            version: "2.8"
            sha256: "578728964e59c47c356aeeedee6220e021e124b9d3e8631d95d9a5e5f06e261c"
          - package: cffi
            version: "2.1.1"
            sha256: "dd31f52ea1086513bb9df30f8fcee9b8918323ae067a3d5b78bc826a000712be"
          - package: cryptography
            version: "50.0.1"
            sha256: "5dd9bda1c12b4162f6ff568eeb5e0ff956c28d14406e875cfe8a63a2d414ff20"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up host Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK and build prerequisites
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "ndk;27.3.13750724"
          sudo apt-get update
          sudo apt-get install -y patchelf pkg-config
          python -m pip install --upgrade "cibuildwheel==4.1.1" "build>=1.2,<2"

      - name: Prepare Rust Android target
        if: ${{ matrix.package == 'cryptography' }}
        run: rustup target add aarch64-linux-android

      - name: Build Android wheel
        env:
          ANDROID_API_LEVEL: "24"
          CIBW_PLATFORM: android
          CIBW_BUILD: cp314-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD_VERBOSITY: "1"
        run: |
          set -euo pipefail
          tools/build_android_wheelhouse_package.sh             "${{ matrix.package }}"             "${{ matrix.version }}"             "${{ matrix.sha256 }}"             "wheelhouse"

      - name: Record wheel evidence
        if: ${{ success() }}
        run: |
          set -euo pipefail
          mkdir -p wheel-evidence
          sha256sum wheelhouse/*.whl | tee wheel-evidence/sha256.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = sorted(Path("wheelhouse").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          wheel = wheels[0]
          if "android_" not in wheel.name or "arm64_v8a" not in wheel.name:
              raise SystemExit(f"unexpected Android wheel tag: {wheel.name}")
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              if not any(name.endswith(".dist-info/METADATA") for name in names):
                  raise SystemExit("wheel has no METADATA")
          Path("wheel-evidence/filename.txt").write_text(wheel.name + "\n")
          PY

      - name: Upload Android wheel
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-wheel-${{ matrix.package }}-${{ matrix.version }}
          path: |
            wheelhouse
            wheel-evidence
          if-no-files-found: warn
          retention-days: 14
