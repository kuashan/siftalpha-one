name: SiftAlpha Cloud Manager M2.2

on:
  push:
    branches:
      - feature/cloud-manager-trading-lab-m2.2
  pull_request:
    branches:
      - feature/cloud-manager-trading-lab-m2.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftalpha-cloud-manager-m2-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-core:
    name: Cloud core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run Cloud core tests
        run: gradle --no-daemon --stacktrace --console=plain :cloud-core:test
