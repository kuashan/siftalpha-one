name: SiftAlpha Cloud Manager M2.2

on:
  push:
    branches:
      - feature/cloud-manager-trading-lab-m2.2
  pull_request:
    branches:
      - feature/cloud-manager-trading-lab-m2.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftalpha-cloud-manager-m2-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-guard:
    name: Cloud architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Cloud module boundaries
        run: bash tools/verify_cloud_manager_architecture.sh

      - name: Verify Trading Lab CI contract
        run: bash tools/verify_cloud_manager_trading_lab_ci.sh

      - name: Verify Trading Lab domain
        run: |
          set -eu
          test -s app/src/main/java/com/siftalpha/studio/cloud/CloudTradingLabController.kt
          test -s app/src/test/java/com/siftalpha/studio/cloud/CloudTradingLabControllerTest.kt
          grep -Fq 'FREQTRADE_PROJECT_ID = "freqtrade"' app/src/main/java/com/siftalpha/studio/cloud/CloudTradingLabController.kt
          echo "TRADING_LAB_DOMAIN=PASS"

      - name: Verify ownership boundary
        run: |
          set -eu
          grep -Fq 'resources(projectId: String)' app/src/main/java/com/siftalpha/studio/cloud/CloudTradingLabController.kt
          if rg -n -i 'docker|docker-compose|generic[[:space:]_-]+command|(^|[^a-z])exec([^a-z]|$)' app/src/main/java/com/siftalpha/studio/cloud; then
            echo "Ownership boundary check found forbidden client-side administration surface" >&2
            exit 1
          fi
          echo "OWNERSHIP_BOUNDARY=PASS"

      - name: Verify Web endpoint validation
        run: |
          set -eu
          grep -Fq 'validateRemoteWebUrl' app/src/main/java/com/siftalpha/studio/cloud/CloudTradingLabPolicy.kt
          grep -Fq 'EXTRA_REMOTE_WEB_URL' app/src/main/java/com/siftalpha/studio/ResultWebActivity.kt
          grep -Fq 'target.host == allowedUri.host' app/src/main/java/com/siftalpha/studio/ResultWebActivity.kt
          test -s app/src/test/java/com/siftalpha/studio/cloud/CloudRemoteWebPolicyTest.kt
          echo "WEB_ENDPOINT_VALIDATION=PASS"

  cloud-modules:
    name: Cloud core and Agent client tests
    needs: architecture-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run Cloud core and Agent client tests
        run: gradle --no-daemon --stacktrace --console=plain :cloud-core:test :cloud-agent-client:test

      - name: Run Cloud Trading Lab domain tests
        run: |
          gradle --no-daemon --stacktrace --console=plain \
            :cloud-core:test --tests '*CloudWebEndpointPolicyTest' \
            :cloud-agent-client:test --tests '*TradingLabDtoTest'

  android-foundation:
    name: Android Foundation tests and APK
    needs: architecture-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build prerequisites
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare official CPython Android component
        run: tools/prepare_embedded_cpython_android.sh app/build/generated/cpython/arm64-v8a

      - name: Prepare Internal Alpine Android runtime
        run: tools/prepare_internal_alpine_android.sh app/build/generated/internal-alpine

      - name: Run Android JVM unit tests
        run: |
          set +e
          mkdir -p build/ci-logs
          gradle --no-daemon --stacktrace --console=plain :core:test :app:testDebugUnitTest 2>&1 | tee build/ci-logs/android-jvm-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Run Android Trading Lab JVM tests
        run: |
          gradle --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            --tests 'com.siftalpha.studio.cloud.CloudTradingLab*' \
            --tests 'com.siftalpha.studio.cloud.CloudRemoteWebPolicyTest'

      - name: Compile Android app
        run: gradle --no-daemon --stacktrace --console=plain :app:compileDebugKotlin

      - name: Assemble Debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload Android Foundation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-manager-m2-2-android-foundation-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results
            app/build/reports/tests
            build/ci-logs/android-jvm-tests.log
          if-no-files-found: warn
          retention-days: 14

  android-keystore-instrumentation:
    name: Android Keystore instrumentation
    needs: architecture-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check Cloud Keystore instrumentation source
        run: test -s app/src/androidTest/java/com/siftalpha/studio/cloud/AndroidCloudCredentialStoreTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform, build tools, NDK, CMake, and emulator
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.3.13750724" "cmake;3.22.1" \
            "emulator" "system-images;android-34;google_apis;x86_64"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare Android runtime assets
        run: |
          set -euo pipefail
          tools/prepare_embedded_cpython_android.sh app/build/generated/cpython/arm64-v8a
          for attempt in 1 2 3; do
            if tools/prepare_internal_alpine_android.sh app/build/generated/internal-alpine; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "Internal Alpine preparation failed transiently; retrying (attempt $((attempt + 1))/3)"
            sleep 5
          done

      - name: Isolate Cloud-only Android test sources
        run: |
          set -eu
          legacy_test_dir="app/src/androidTest/java/com/siftalpha/studio/siftalphax"
          if [ -d "$legacy_test_dir" ]; then
            mkdir -p build/ci-excluded-android-tests
            mv "$legacy_test_dir" build/ci-excluded-android-tests/
          fi

      - name: Prepare Cloud-only Gradle variant in CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          marker = 'val trustedKeystorePayload = providers.gradleProperty("SIFTALPHA_DEBUG_KEYSTORE_B64")'
          property_block = (
              '// CI-only Cloud Keystore instrumentation variant.\n'
              'val cloudKeystoreInstrumentation = providers.gradleProperty("siftalphaCloudKeystoreTest").orNull == "true"\n\n'
          )
          if "val cloudKeystoreInstrumentation =" in text:
              raise SystemExit("Cloud Keystore variant logic already exists; refusing duplicate CI patch")
          if marker not in text:
              raise SystemExit("Unexpected app/build.gradle.kts: Keystore property insertion point is missing")
          text = text.replace(marker, property_block + marker, 1)

          old_abi = "        ndk {\n            abiFilters += listOf(\"arm64-v8a\")\n        }"
          new_abi = "        ndk {\n            abiFilters += if (cloudKeystoreInstrumentation) {\n                listOf(\"x86_64\")\n            } else {\n                listOf(\"arm64-v8a\")\n            }\n        }"
          if text.count(old_abi) != 1:
              raise SystemExit("Unexpected app/build.gradle.kts: ABI block changed")
          text = text.replace(old_abi, new_abi, 1)

          old_native = (
              "    externalNativeBuild {\n"
              "        cmake {\n"
              "            path = file(\"src/main/cpp/CMakeLists.txt\")\n"
              "            version = \"3.22.1\"\n"
              "        }\n"
              "    }\n\n"
              "    sourceSets {\n"
              "        getByName(\"main\") {\n"
              "            assets.srcDir(embeddedCpythonAssets)\n"
              "            assets.srcDir(internalAlpineAssets)\n"
              "            jniLibs.srcDir(embeddedCpythonJniLibs)\n"
              "            jniLibs.srcDir(internalAlpineJniLibs)\n"
              "        }\n"
              "    }"
          )
          new_native = (
              "    if (!cloudKeystoreInstrumentation) {\n"
              "        externalNativeBuild {\n"
              "            cmake {\n"
              "                path = file(\"src/main/cpp/CMakeLists.txt\")\n"
              "                version = \"3.22.1\"\n"
              "            }\n"
              "        }\n"
              "    }\n\n"
              "    if (!cloudKeystoreInstrumentation) {\n"
              "        sourceSets {\n"
              "            getByName(\"main\") {\n"
              "                assets.srcDir(embeddedCpythonAssets)\n"
              "                assets.srcDir(internalAlpineAssets)\n"
              "                jniLibs.srcDir(embeddedCpythonJniLibs)\n"
              "                jniLibs.srcDir(internalAlpineJniLibs)\n"
              "            }\n"
              "        }\n"
              "    }\n\n"
              "    if (cloudKeystoreInstrumentation) {\n"
              "        sourceSets {\n"
              "            getByName(\"androidTest\") {\n"
              "                java.setSrcDirs(listOf(\"src/androidTest/java/com/siftalpha/studio/cloud\"))\n"
              "            }\n"
              "        }\n"
              "    }"
          )
          if text.count(old_native) != 1:
              raise SystemExit("Unexpected app/build.gradle.kts: native/source-set blocks changed")
          path.write_text(text.replace(old_native, new_native, 1))
          print("Prepared guarded Cloud-only x86_64 instrumentation variant in the ephemeral CI checkout")
          PY

      - name: Run Android Keystore tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 6000M
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            gradle --no-daemon --stacktrace --console=plain :app:connectedDebugAndroidTest -PsiftalphaCloudKeystoreTest=true -Pandroid.testInstrumentationRunnerArguments.class=com.siftalpha.studio.cloud.AndroidCloudCredentialStoreTest
            echo "ANDROID_KEYSTORE_TEST=PASS"

      - name: Upload Android instrumentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-manager-m2-2-android-instrumentation-${{ github.run_number }}
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: warn
          retention-days: 14
