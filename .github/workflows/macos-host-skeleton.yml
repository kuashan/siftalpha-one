name: SiftAlpha X macOS Host Runtime

on:
  push:
    branches:
      - feature/cross-platform-core
    paths:
      - .github/workflows/macos-host-skeleton.yml
      - build.gradle.kts
      - settings.gradle.kts
      - core/**
      - macosApp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftalpha-macos-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SiftAlpha X macOS host
    runs-on: macos-15-intel
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Ventura-compatible JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '17'
          architecture: x64
          check-latest: true

      - name: Verify Intel JDK toolchain
        run: |
          set -euo pipefail
          mkdir -p macos-evidence
          uname -a | tee macos-evidence/runner-uname.txt
          test "$(uname -m)" = "x86_64"
          file "$JAVA_HOME/bin/java" | tee macos-evidence/java-file.txt
          "$JAVA_HOME/bin/java" -version > macos-evidence/java-version.txt 2>&1
          "$JAVA_HOME/bin/jpackage" --version | tee macos-evidence/jpackage-version.txt

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Build Core and macOS host
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee macos-evidence/source-commit.txt
          gradle --version > macos-evidence/gradle-version.txt
          gradle --no-daemon --stacktrace --console=plain \
            :core:test \
            :macosApp:test \
            :macosApp:installDist | tee macos-evidence/gradle-build.txt

      - name: Acquire pinned managed Python 3.14.7
        run: |
          set -euo pipefail
          PYTHON_URL='https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.14.7%2B20260901-x86_64-apple-darwin-install_only_stripped.tar.gz'
          PYTHON_SHA256='7e151a7c9028855b61a7d6e78381f2020a1ef185281399f3b1aafc5e1c9a1a64'
          rm -rf macos-managed-python
          mkdir -p macos-managed-python
          curl -fL --retry 3 --retry-delay 2 "$PYTHON_URL" -o macos-managed-python/python.tar.gz
          printf '%s  %s\n' "$PYTHON_SHA256" macos-managed-python/python.tar.gz | shasum -a 256 -c -
          tar -xzf macos-managed-python/python.tar.gz -C macos-managed-python
          test -x macos-managed-python/python/bin/python3
          macos-managed-python/python/bin/python3 --version | tee macos-evidence/managed-python-version.txt
          macos-managed-python/python/bin/python3 -m pip --version | tee macos-evidence/managed-python-pip.txt
          macos-managed-python/python/bin/python3 -m venv --help >/dev/null
          file macos-managed-python/python/bin/python3 | tee macos-evidence/managed-python-file.txt
          grep -q 'x86_64' macos-evidence/managed-python-file.txt

      - name: Prove macOS Core load and runtime discovery
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --probe \
            | tee macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_MACOS_HOST=READY$' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CORE_LOAD=PASS$' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CAPABILITY=host_process_execution = AVAILABLE$' macos-evidence/core-load-probe.txt
          grep -Eq '^SIFTALPHA_CAPABILITY=container_runtime = (AVAILABLE|UNAVAILABLE|UNKNOWN)$' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CONTAINER_PROVIDER=docker|' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CONTAINER_PROVIDER=podman|' macos-evidence/core-load-probe.txt
          for tool in python nodejs bun git shell; do
            grep -q "^SIFTALPHA_HOST_TOOL=$tool|" macos-evidence/core-load-probe.txt
          done

      - name: Prove M6.1 container capability and Compose plan
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m6-container-plan-probe \
            | tee macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61_CONTAINER_PLAN_PROBE=PASS$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=compose_manifest=compose.yaml$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=compose_services=db,web$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=web_published_port=18080$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=web_depends_on=db$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=available_plan=READY$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=unavailable_plan=CAPABILITY_UNAVAILABLE$' macos-evidence/m6-container-plan-probe.txt
          grep -q '^SIFTALPHA_M61=unknown_plan=CAPABILITY_UNKNOWN$' macos-evidence/m6-container-plan-probe.txt

      - name: Prove M6.2 Compose runtime workflow and isolation
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m6-compose-workflow-probe \
            | tee macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62_COMPOSE_WORKFLOW_PROBE=PASS$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=compose_detect_a=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=compose_detect_b=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=project_identity_distinct=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=advisor_ready=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=prepare_a=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=prepare_b=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=start_a=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=start_b=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=a_running=RUNNING$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=b_running=RUNNING$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=stop_a=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=b_after_a_stop=RUNNING$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=restart_a=true$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=a_after_restart=RUNNING$' macos-evidence/m6-compose-workflow-probe.txt
          grep -q '^SIFTALPHA_M62=web_source=CONTAINER_PORT$' macos-evidence/m6-compose-workflow-probe.txt

      - name: Prove M6.2 managed container install flow
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m6-container-install-probe \
            | tee macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_CONTAINER_INSTALL_PROBE=PASS$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=compose_detect=true$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=before_install_plan=INSTALL_MANAGED_DOCKER$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=before_primary=INSTALL_CONTAINER$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=installer_calls=1$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=install_and_prepare=true$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=after_advice=READY$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=after_environment_ready=true$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=after_install_phase=COMPLETE$' macos-evidence/m6-container-install-probe.txt
          grep -q '^SIFTALPHA_M62_INSTALL=after_primary=RUN$' macos-evidence/m6-container-install-probe.txt

      - name: Verify managed container upstream assets are reachable
        run: |
          set -euo pipefail
          urls=(
            "https://github.com/abiosoft/colima/releases/download/v0.10.3/colima-Darwin-x86_64"
            "https://github.com/abiosoft/colima/releases/download/v0.10.3/colima-Darwin-arm64"
            "https://github.com/lima-vm/lima/releases/download/v2.2.0/lima-2.2.0-Darwin-x86_64.tar.gz"
            "https://github.com/lima-vm/lima/releases/download/v2.2.0/lima-2.2.0-Darwin-arm64.tar.gz"
            "https://download.docker.com/mac/static/stable/x86_64/docker-29.8.1.tgz"
            "https://download.docker.com/mac/static/stable/aarch64/docker-29.8.1.tgz"
            "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-darwin-x86_64"
            "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-darwin-aarch64"
          )
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --range 0-0 --output /dev/null "$url"
          done

      - name: Prove M4.1 import detect plan
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m4-plan-probe \
            | tee macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN_PROBE=PASS$' macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN=python_import_detect_plan=READY_TO_PREPARE$' macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN=python_primary=python$' macos-evidence/m4-plan-probe.txt

      - name: Prove M4.2 managed Python full project workflow
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" \
            -Dsiftalpha.managed.python.root="$PWD/macos-managed-python/python" \
            -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m4-workflow-probe \
            | tee macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42_WORKFLOW_PROBE=PASS$' macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42=prepare=PASS$' macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42=run=PASS$' macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42=stop=true$' macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42=restart=true$' macos-evidence/m4-workflow-probe.txt
          grep -q '^SIFTALPHA_M42=final_stop=true$' macos-evidence/m4-workflow-probe.txt

      - name: Prove M5.1 Normal Mode product-state flow
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" \
            -Dsiftalpha.managed.python.root="$PWD/macos-managed-python/python" \
            -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m5-normal-ui-probe \
            | tee macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51_NORMAL_PROBE=PASS$' macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51=initial_action=PREPARE$' macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51=after_prepare_action=RUN$' macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51=running_action=OPEN_RESULT$' macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51=running_secondary_stop=true$' macos-evidence/m5-normal-ui-probe.txt
          grep -q '^SIFTALPHA_M51=after_stop_action=RUN$' macos-evidence/m5-normal-ui-probe.txt

      - name: Prove M5.2 Developer Mode shared-state parity
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" \
            -Dsiftalpha.managed.python.root="$PWD/macos-managed-python/python" \
            -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m5-shared-state-probe \
            | tee macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52_SHARED_STATE_PROBE=PASS$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=normal_running=RUNNING$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=developer_running=RUNNING$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=runtime_version=Python 3.14.7$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=environment_generation_same=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=result_url_same=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=raw_logs_same=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=presentation_switch_pid_stable=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=developer_stop=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=normal_after_developer_stop=RUN$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=project_b_after_a_stop=RUNNING$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=normal_run=true$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=developer_after_normal_run=RUNNING$' macos-evidence/m5-shared-state-probe.txt
          grep -q '^SIFTALPHA_M52=environment_reused_after_normal_run=true$' macos-evidence/m5-shared-state-probe.txt

      - name: Prove project-scoped macOS process control
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m3-process-probe \
            | tee macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS_PROBE=PASS$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_a_stop=STOPPED$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_b_after_a_stop=RUNNING$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_b_stop=STOPPED$' macos-evidence/m3-process-probe.txt

      - name: Verify no Android dependency leaks into macOS host
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain \
            :macosApp:dependencies --configuration runtimeClasspath \
            | tee macos-evidence/runtime-dependencies.txt
          if grep -E '(^|[[:space:]])(com\.android|androidx\.)' macos-evidence/runtime-dependencies.txt; then
            echo "Android dependency leaked into macOS host runtimeClasspath" >&2
            exit 1
          fi

      - name: Package Ventura-baseline SiftAlpha X.app
        run: |
          set -euo pipefail
          rm -rf macos-dist
          mkdir -p macos-dist

          "$JAVA_HOME/bin/jpackage" \
            --type app-image \
            --name "SiftAlpha X" \
            --dest macos-dist \
            --input macosApp/build/install/macosApp/lib \
            --main-jar macosApp.jar \
            --main-class com.siftalpha.macos.SiftAlphaMacAppKt \
            --mac-package-identifier com.siftalpha.macos

          APP="macos-dist/SiftAlpha X.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          test -f "$PLIST"

          mkdir -p "$APP/Contents/app/managed-python"
          ditto macos-managed-python/python "$APP/Contents/app/managed-python/python"
          test -x "$APP/Contents/app/managed-python/python/bin/python3"
          "$APP/Contents/app/managed-python/python/bin/python3" --version \
            | tee macos-evidence/packaged-managed-python-version.txt

          CFG="$APP/Contents/app/SiftAlpha X.cfg"
          test -f "$CFG"
          if grep -Fxq 'java-options=X' "$CFG"; then
            echo "Invalid split JVM option detected in packaged app" >&2
            cat "$CFG" >&2
            exit 1
          fi
          cat "$CFG" | tee macos-evidence/app-launcher-config.txt

          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 13.0" "$PLIST"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          plutil -p "$PLIST" | tee macos-evidence/info-plist.txt
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$PLIST")" = "13.0"

          file "$APP/Contents/MacOS/SiftAlpha X" | tee macos-evidence/app-launcher-file.txt
          grep -q 'x86_64' macos-evidence/app-launcher-file.txt

          inspect_minos() {
            binary="$1"
            label="$2"
            echo "=== $label ===" | tee -a macos-evidence/ventura-minos.txt
            file "$binary" | tee -a macos-evidence/ventura-minos.txt
            otool -l "$binary" > "macos-evidence/${label}-otool.txt"
            minos="$(awk '
              /cmd LC_BUILD_VERSION/ { build=1; legacy=0; next }
              /cmd LC_VERSION_MIN_MACOSX/ { legacy=1; build=0; next }
              build && $1=="minos" { print $2; exit }
              legacy && $1=="version" { print $2; exit }
            ' "macos-evidence/${label}-otool.txt")"
            test -n "$minos"
            echo "MIN_OS=$minos" | tee -a macos-evidence/ventura-minos.txt
            python3 -c 'import sys; parts=tuple(int(p) for p in sys.argv[1].split(".")[:2]); sys.exit(f"binary requires macOS {sys.argv[1]}, newer than Ventura 13") if parts > (13, 0) else None' "$minos"
          }

          inspect_minos "$APP/Contents/MacOS/SiftAlpha X" "launcher"
          inspect_minos "$APP/Contents/app/managed-python/python/bin/python3" "managed-python"

          MANAGED_LIBPYTHON="$(find "$APP/Contents/app/managed-python/python/lib" -type f -name 'libpython3.14*.dylib' -print -quit)"
          test -n "$MANAGED_LIBPYTHON"
          inspect_minos "$MANAGED_LIBPYTHON" "managed-libpython"

          LIBJLI="$(find "$APP/Contents/runtime" -type f -name 'libjli.dylib' -print -quit)"
          LIBJVM="$(find "$APP/Contents/runtime" -type f -name 'libjvm.dylib' -print -quit)"
          test -n "$LIBJLI"
          test -n "$LIBJVM"
          inspect_minos "$LIBJLI" "libjli"
          inspect_minos "$LIBJVM" "libjvm"

          find "$APP" -maxdepth 4 -type f | sort | tee macos-evidence/app-files.txt
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            macos-dist/SiftAlpha-X-m6.2-managed-container-ventura-x64.zip
          shasum -a 256 macos-dist/SiftAlpha-X-m6.2-managed-container-ventura-x64.zip \
            | tee macos-evidence/app-zip-sha256.txt

      - name: Upload macOS app and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: siftalpha-macos-m6.2-managed-container-ventura-x64-${{ github.run_number }}
          path: |
            macos-dist/SiftAlpha-X-m6.2-managed-container-ventura-x64.zip
            macos-evidence
          if-no-files-found: warn
          retention-days: 14
