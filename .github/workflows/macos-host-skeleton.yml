name: SiftAlpha X macOS Host Runtime

on:
  push:
    branches:
      - feature/cross-platform-core
    paths:
      - .github/workflows/macos-host-skeleton.yml
      - build.gradle.kts
      - settings.gradle.kts
      - core/**
      - macosApp/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siftalpha-macos-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SiftAlpha X macOS host
    runs-on: macos-15-intel
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Catalina-compatible JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '17'
          architecture: x64
          check-latest: true

      - name: Verify Intel JDK toolchain
        run: |
          set -euo pipefail
          mkdir -p macos-evidence
          uname -a | tee macos-evidence/runner-uname.txt
          test "$(uname -m)" = "x86_64"
          file "$JAVA_HOME/bin/java" | tee macos-evidence/java-file.txt
          "$JAVA_HOME/bin/java" -version > macos-evidence/java-version.txt 2>&1
          "$JAVA_HOME/bin/jpackage" --version | tee macos-evidence/jpackage-version.txt

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Build Core and macOS host
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee macos-evidence/source-commit.txt
          gradle --version > macos-evidence/gradle-version.txt
          gradle --no-daemon --stacktrace --console=plain \
            :core:test \
            :macosApp:test \
            :macosApp:installDist | tee macos-evidence/gradle-build.txt

      - name: Prove macOS Core load and runtime discovery
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --probe \
            | tee macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_MACOS_HOST=READY$' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CORE_LOAD=PASS$' macos-evidence/core-load-probe.txt
          grep -q '^SIFTALPHA_CAPABILITY=host_process_execution = AVAILABLE$' macos-evidence/core-load-probe.txt
          for tool in python nodejs bun git shell; do
            grep -q "^SIFTALPHA_HOST_TOOL=$tool|" macos-evidence/core-load-probe.txt
          done

      - name: Prove M4.1 import detect plan
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m4-plan-probe \
            | tee macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN_PROBE=PASS$' macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN=python_import_detect_plan=READY_TO_PREPARE$' macos-evidence/m4-plan-probe.txt
          grep -q '^SIFTALPHA_M4_PLAN=python_primary=python$' macos-evidence/m4-plan-probe.txt

      - name: Prove project-scoped macOS process control
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -cp "macosApp/build/install/macosApp/lib/*" \
            com.siftalpha.macos.SiftAlphaMacAppKt --m3-process-probe \
            | tee macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS_PROBE=PASS$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_a_stop=STOPPED$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_b_after_a_stop=RUNNING$' macos-evidence/m3-process-probe.txt
          grep -q '^SIFTALPHA_M3_PROCESS=project_b_stop=STOPPED$' macos-evidence/m3-process-probe.txt

      - name: Verify no Android dependency leaks into macOS host
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain \
            :macosApp:dependencies --configuration runtimeClasspath \
            | tee macos-evidence/runtime-dependencies.txt
          if grep -E '(^|[[:space:]])(com\.android|androidx\.)' macos-evidence/runtime-dependencies.txt; then
            echo "Android dependency leaked into macOS host runtimeClasspath" >&2
            exit 1
          fi

      - name: Package Catalina-compatible SiftAlpha X.app
        run: |
          set -euo pipefail
          rm -rf macos-dist
          mkdir -p macos-dist

          "$JAVA_HOME/bin/jpackage" \
            --type app-image \
            --name "SiftAlpha X" \
            --dest macos-dist \
            --input macosApp/build/install/macosApp/lib \
            --main-jar macosApp.jar \
            --main-class com.siftalpha.macos.SiftAlphaMacAppKt \
            --mac-package-identifier com.siftalpha.macos

          APP="macos-dist/SiftAlpha X.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          test -f "$PLIST"

          CFG="$APP/Contents/app/SiftAlpha X.cfg"
          test -f "$CFG"
          if grep -Fxq 'java-options=X' "$CFG"; then
            echo "Invalid split JVM option detected in packaged app" >&2
            cat "$CFG" >&2
            exit 1
          fi
          cat "$CFG" | tee macos-evidence/app-launcher-config.txt

          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 10.15" "$PLIST"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          plutil -p "$PLIST" | tee macos-evidence/info-plist.txt
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$PLIST")" = "10.15"

          file "$APP/Contents/MacOS/SiftAlpha X" | tee macos-evidence/app-launcher-file.txt
          grep -q 'x86_64' macos-evidence/app-launcher-file.txt

          inspect_minos() {
            binary="$1"
            label="$2"
            echo "=== $label ===" | tee -a macos-evidence/catalina-minos.txt
            file "$binary" | tee -a macos-evidence/catalina-minos.txt
            otool -l "$binary" > "macos-evidence/${label}-otool.txt"
            minos="$(awk '
              /cmd LC_BUILD_VERSION/ { build=1; legacy=0; next }
              /cmd LC_VERSION_MIN_MACOSX/ { legacy=1; build=0; next }
              build && $1=="minos" { print $2; exit }
              legacy && $1=="version" { print $2; exit }
            ' "macos-evidence/${label}-otool.txt")"
            test -n "$minos"
            echo "MIN_OS=$minos" | tee -a macos-evidence/catalina-minos.txt
            python3 -c 'import sys; parts=tuple(int(p) for p in sys.argv[1].split(".")[:2]); sys.exit(f"binary requires macOS {sys.argv[1]}, newer than Catalina 10.15") if parts > (10, 15) else None' "$minos"
          }

          inspect_minos "$APP/Contents/MacOS/SiftAlpha X" "launcher"

          LIBJLI="$(find "$APP/Contents/runtime" -type f -name 'libjli.dylib' -print -quit)"
          LIBJVM="$(find "$APP/Contents/runtime" -type f -name 'libjvm.dylib' -print -quit)"
          test -n "$LIBJLI"
          test -n "$LIBJVM"
          inspect_minos "$LIBJLI" "libjli"
          inspect_minos "$LIBJVM" "libjvm"

          find "$APP" -maxdepth 4 -type f | sort | tee macos-evidence/app-files.txt
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            macos-dist/SiftAlpha-X-m4.1-catalina-x64.zip
          shasum -a 256 macos-dist/SiftAlpha-X-m4.1-catalina-x64.zip \
            | tee macos-evidence/app-zip-sha256.txt

      - name: Upload macOS app and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: siftalpha-macos-m4.1-catalina-x64-${{ github.run_number }}
          path: |
            macos-dist/SiftAlpha-X-m4.1-catalina-x64.zip
            macos-evidence
          if-no-files-found: warn
          retention-days: 14
