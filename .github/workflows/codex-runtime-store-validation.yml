name: Candidate RuntimeLifecycleStore Validation

on:
  push:
    branches:
      - codex/w2-runtime-lifecycle-store-migration-20260915

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests then APK assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run unit tests first
        run: gradle --no-daemon --stacktrace --console=plain testDebugUnitTest

      - name: Assemble debug APK after tests
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug
